# One command for the whole system:  docker compose up --build
#   API:        http://localhost:8000/docs
#   Dashboard:  http://localhost:8501
services:
  api:
    build:
      context: .
      target: api
    image: windgrid-api:local
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: dashboard
    image: windgrid-dashboard:local
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
