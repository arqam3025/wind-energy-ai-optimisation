# Path-based routing through any ingress controller (e.g. ingress-nginx):
#   /api/...  -> dispatch API      /  -> dashboard
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: windgrid
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service: {name: windgrid-api, port: {name: http}}
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service: {name: windgrid-dashboard, port: {name: http}}
