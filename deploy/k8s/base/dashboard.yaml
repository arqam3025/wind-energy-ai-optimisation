# WindGrid dashboard (Streamlit). Sessions are held in memory, so one replica with session affinity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windgrid-dashboard
  labels: {app.kubernetes.io/name: windgrid-dashboard, app.kubernetes.io/part-of: windgrid}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: windgrid-dashboard}
  template:
    metadata:
      labels: {app.kubernetes.io/name: windgrid-dashboard, app.kubernetes.io/part-of: windgrid}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dashboard
          image: ghcr.io/arqam3025/windgrid-dashboard:latest
          ports:
            - {name: http, containerPort: 8501}
          env:
            - {name: HOME, value: /tmp}
            - {name: MPLCONFIGDIR, value: /tmp/matplotlib}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1536Mi}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: windgrid-dashboard
  labels: {app.kubernetes.io/name: windgrid-dashboard, app.kubernetes.io/part-of: windgrid}
spec:
  selector: {app.kubernetes.io/name: windgrid-dashboard}
  sessionAffinity: ClientIP
  ports:
    - {name: http, port: 80, targetPort: http}
