name: CI

on:
  push:
    branches: [main, research/publication-v2, "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.6
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[all]"
      - name: Data-free test suites
        shell: bash
        run: |
          set -e
          for suite in windgrid/tests publication_v2/tests publication_v2/stage31/tests publication_v2/stage32/tests \
                       publication_v2/stage33/tests publication_v2/stage4/tests publication_v2/stage5/tests; do
            echo "::group::$suite"
            python -B -m unittest discover -s "$suite" -v
            echo "::endgroup::"
          done
      - name: Dashboard page tests
        run: python -B -m unittest tests.test_controller_lab_page tests.test_real_data_page -v
      - name: CLI smoke test
        run: |
          windgrid --help
          windgrid dispatch --controller graded_mpc
          windgrid simulate --episodes 2

  infrastructure:
    name: Infrastructure as code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform format and validate
        run: |
          terraform -chdir=deploy/azure/terraform fmt -check -recursive
          terraform -chdir=deploy/azure/terraform init -backend=false -input=false
          terraform -chdir=deploy/azure/terraform validate
      - name: Kubernetes manifests build
        run: |
          kubectl kustomize deploy/k8s/base > /dev/null
          kubectl kustomize deploy/k8s/overlays/ci > /dev/null
      - name: Shell scripts
        run: shellcheck deploy/azure/bootstrap.sh

  docker:
    name: Containers (Docker + Kubernetes)
    runs-on: ubuntu-latest
    needs: [lint, test, infrastructure]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build --target api -t windgrid-api:ci .
          docker build --target dashboard -t windgrid-dashboard:ci .
      - name: API container answers requests
        run: |
          docker run -d --name api -p 8000:8000 windgrid-api:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 2; done
          curl -fs http://localhost:8000/v1/sample > request.json
          curl -fs -X POST http://localhost:8000/v1/dispatch -H "Content-Type: application/json" -d @request.json | tee response.json
          python3 -c "import json; r = json.load(open('response.json')); assert r['forecast_available'] and r['controller'] == 'graded_mpc'"
      - name: Dashboard container is healthy
        run: |
          docker run -d --name dashboard -p 8501:8501 windgrid-dashboard:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8501/_stcore/health && exit 0; sleep 2; done
          docker logs dashboard; exit 1
      - name: Create a Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: windgrid
      - name: Deploy to Kubernetes and call the API
        run: |
          kind load docker-image windgrid-api:ci windgrid-dashboard:ci --name windgrid
          kubectl apply -k deploy/k8s/overlays/ci
          kubectl -n windgrid rollout status deployment/windgrid-api --timeout=240s
          kubectl -n windgrid rollout status deployment/windgrid-dashboard --timeout=240s
          kubectl -n windgrid get pods -o wide
          kubectl -n windgrid port-forward service/windgrid-api 8080:80 &
          for i in $(seq 1 30); do curl -fs http://localhost:8080/health && break; sleep 2; done
          curl -fs http://localhost:8080/v1/sample > k8s-request.json
          curl -fs -X POST http://localhost:8080/v1/dispatch -H "Content-Type: application/json"             -d @k8s-request.json | head -c 300
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker logs api || true
          kubectl -n windgrid describe pods || true
          kubectl -n windgrid logs -l app.kubernetes.io/part-of=windgrid --tail=100 || true

  publish:
    name: Publish images (GHCR)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag=$([[ "${GITHUB_REF}" == refs/tags/* ]] && echo "${GITHUB_REF#refs/tags/}" || echo latest)
          for target in api dashboard; do
            image=ghcr.io/$owner/windgrid-$target
            docker build --target $target -t $image:$tag -t $image:sha-${GITHUB_SHA::7} .
            docker push --all-tags $image
          done
